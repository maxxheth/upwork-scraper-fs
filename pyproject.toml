[project]
name = "upwork-scraper-fs"
version = "0.1.0"
description = "UpWork scraper using FlareSolverr + Decodo proxies + Scrapling parsing & UI drift auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scrapling[fetchers]>=0.4.15",
    "httpx>=0.28.0",
    "msgspec>=0.21.1",
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = [".venv", "__pycache__"]
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportCallIssue = false  # Scrapling's TextHandler is callable but stubs don't reflect it
