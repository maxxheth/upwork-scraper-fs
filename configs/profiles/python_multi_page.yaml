name: "python_multi_page"
description: "Scrape up to 4 pages (target 200 jobs) of Python and scraping jobs with proxy rotation"
selectors_file: "configs/selectors/upwork.yaml"

transport:
  adapter: "flaresolverr"
  proxy_mode: "rotation"
  max_timeout_ms: 60000
  max_retries: 3
  retry_backoff_seconds: 2.0

search:
  mode: "live_search"
  query: "python developer"
  queries:
    - "python developer"
    - "python scraping"
    - "fastapi postgresql"
  sort: "recency"
  per_page: 50
  start_page: 1
  max_pages: 4
  target_jobs: 200
  delay_between_pages_seconds: 5.0
  deduplicate_by_url: true

filters:
  required_keywords: []
  exclude_keywords: []
  min_score: null
  max_posted_age_days: null

enrichment:
  enabled: false
  max_jobs_to_enrich: null
  detail_retries: 2
  delay_between_details_seconds: 2.0
  compute_proposal_scores: false

output:
  directory: "output"
  filename_prefix: "python_all_pages"
  save_per_page: true
  save_combined: true
