name: "default_search"
description: "Standard search listings scrape via FlareSolverr with proxy rotation"
selectors_file: "configs/selectors/upwork.yaml"

transport:
  adapter: "flaresolverr"
  proxy_mode: "rotation"
  max_timeout_ms: 60000
  max_retries: 3
  retry_backoff_seconds: 2.0

search:
  mode: "live_search"
  query: "golang developer"
  sort: null
  start_page: 1
  max_pages: 1
  target_jobs: null
  delay_between_pages_seconds: 5.0
  deduplicate_by_url: true

filters:
  required_keywords: []
  min_score: null
  max_posted_age_days: null

enrichment:
  enabled: false
  max_jobs_to_enrich: null
  detail_retries: 2
  delay_between_details_seconds: 2.0
  compute_proposal_scores: false

output:
  directory: "output"
  filename_prefix: "upwork_search"
  save_per_page: false
  save_combined: true
