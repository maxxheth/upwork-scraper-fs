server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Bedrock WordPress setup
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP requests to WordPress FPM
    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 64M \n post_max_size = 64M";
    }

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(composer\.json|composer\.lock|package\.json|package-lock\.json|\.env|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bedrock specific: wp-content outside web root
    location ~* /app/uploads/ {
        try_files $uri =404;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
}
