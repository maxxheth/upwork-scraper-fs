# Netlify deployment configuration for Bedrock/Sage WordPress sites
# Used for headless WordPress or static export deployments

[build]
  command = "npm run build && composer install --no-dev --optimize-autoloader"
  publish = "web"
  base = "/"

[build.environment]
  PHP_VERSION = "8.1"
  NODE_VERSION = "20"
  COMPOSER_VERSION = "2"

# Redirect rules
[[redirects]]
  from = "/wp/*"
  to = "/index.php"
  status = 200
  force = false

[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/wp-content/uploads/:splat"
  status = 200

[[redirects]]
  from = "/wp-admin/*"
  to = "/wp-admin/:splat"
  status = 200

# SPA fallback for headless mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Path = ["!/api/*", "!/wp-content/*", "!/wp-admin/*", "!/wp-json/*", "!/*.php", "!/*.xml", "!/*.txt"]}

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Cache control for static assets
[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/themes/sage/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lambda functions for serverless WordPress
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
