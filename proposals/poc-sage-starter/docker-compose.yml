version: '3.8'

services:
  ##
  # WordPress (Bedrock)
  ##
  wordpress:
    image: wordpress:6.4-fpm-alpine
    container_name: sage_wordpress
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: sage
      WORDPRESS_DB_USER: sage
      WORDPRESS_DB_PASSWORD: sage_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_SITEURL:-http://localhost:8080/wp}');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_POST_REVISIONS', 5);
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sage_network

  ##
  # Nginx Web Server
  ##
  nginx:
    image: nginx:1.25-alpine
    container_name: sage_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./web:/var/www/html
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
    networks:
      - sage_network

  ##
  # MySQL Database
  ##
  db:
    image: mariadb:10.11
    container_name: sage_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sage
      MYSQL_USER: sage
      MYSQL_PASSWORD: sage_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage_network

  ##
  # Redis Cache (optional)
  ##
  redis:
    image: redis:7-alpine
    container_name: sage_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sage_network

  ##
  # phpMyAdmin (dev only)
  ##
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: sage_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: sage
      PMA_PASSWORD: sage_password
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - sage_network

  ##
  # MailHog (dev email catcher)
  ##
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sage_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - sage_network

volumes:
  db_data:
  redis_data:

networks:
  sage_network:
    driver: bridge
